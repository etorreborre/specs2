version = "3.11.5"
runner.dialect = scala3

maxColumn = 120

assumeStandardLibraryStripMargin = true
align.stripMargin = true
align.preset = some

spaces.inByNameTypes = false

# scalafmt 3.11.5 cannot parse `into case class`. Remove these exclusions after an upgrade to a scalafmt version
# that includes https://github.com/scalameta/scalameta/pull/4803
project.excludePaths = [
  "glob:**/guide/**/*.scala",
  "glob:**/org/specs2/control/Property.scala",
  "glob:**/org/specs2/specification/core/SpecStructure.scala",
  "glob:**/org/specs2/specification/core/Fragments.scala",
  "glob:**/org/specs2/matcher/DataTable.scala",
  "glob:**/org/specs2/matcher/JsonMatchers.scala",
]

project.excludeFilters = [
 "org.specs2.matcher.describe.DiffableLowImplicits2",
 "org.specs2.matcher.describe.DiffableSpec",
]
